name: touxian-campus

# 精简版：为 2 GiB 内存的小型云服务器准备。
# 与原版 compose.yml 的差异：
#   1) 去掉 Meilisearch —— 检索回退到产品内置的 LocalTextIndex（见 server/campus/search.py）
#   2) 给每个容器设置内存上限，避免 OOM 时拖垮整机
#   3) worker 降低并发，减少峰值内存
#
# 用法：
#   cd deploy/campus
#   cp .env.example .env && chmod 600 .env    # 填写 6 个必填项
#   docker compose -f compose.small.yml build api
#   docker compose -f compose.small.yml up -d

x-campus-service: &campus-service
  image: touxian-campus:local
  build:
    context: ../..
    dockerfile: deploy/campus/Dockerfile
  init: true
  restart: unless-stopped
  env_file: .env
  environment: &campus-environment
    CAMPUS_ENV: production
    CAMPUS_DEV_AUTH: "false"
    CAMPUS_DEMO: "false"
    CAMPUS_EMBEDDED_WORKER: "false"
    CAMPUS_DATA_DIR: /var/lib/touxian
    CAMPUS_DATABASE_URL: postgresql+psycopg://campus:${CAMPUS_POSTGRES_PASSWORD:?Set CAMPUS_POSTGRES_PASSWORD in .env}@postgres:5432/campus
    CAMPUS_SECRET: ${CAMPUS_SECRET:?Set a strong CAMPUS_SECRET in .env}
    CAMPUS_ALLOWED_ORIGINS: ${CAMPUS_ALLOWED_ORIGINS:?Set the exact HTTPS origin in .env}
    CAMPUS_ADMIN_EMAILS: ${CAMPUS_ADMIN_EMAILS:?Set administrator login email in .env}
    # 关键差异：不启用 Meilisearch，检索走内置本地索引
    CAMPUS_MEILI_URL: ""
    CAMPUS_MEILI_KEY: ""
    CAMPUS_SMTP_HOST: ${CAMPUS_SMTP_HOST:?Set SMTP host for production login}
    CAMPUS_SMTP_FROM: ${CAMPUS_SMTP_FROM:?Set SMTP sender for production login}
    CAMPUS_SMTP_PORT: ${CAMPUS_SMTP_PORT:-587}
    CAMPUS_SMTP_USERNAME: ${CAMPUS_SMTP_USERNAME:-}
    CAMPUS_SMTP_PASSWORD: ${CAMPUS_SMTP_PASSWORD:-}
    CAMPUS_SMTP_STARTTLS: ${CAMPUS_SMTP_STARTTLS:-true}
    CAMPUS_SMTP_SSL: ${CAMPUS_SMTP_SSL:-false}
    # 小内存：降低并发与批量
    CAMPUS_WORKER_CONCURRENCY: ${CAMPUS_WORKER_CONCURRENCY:-1}
  volumes:
    - campus-data:/var/lib/touxian
    - ../../config/campus-sources.json:/app/config/campus-sources.json:ro
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_DB: campus
      POSTGRES_PASSWORD: ${CAMPUS_POSTGRES_PASSWORD:?Set CAMPUS_POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      # 小内存调优
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAINTENANCE_WORK_MEM: 32MB
      POSTGRES_MAX_CONNECTIONS: "40"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
      - -c
      - effective_cache_size=384MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 640M

  api:
    <<: *campus-service
    command:
      - uvicorn
      - server.campus_app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - ${CAMPUS_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 700M

  worker:
    <<: *campus-service
    command: ["python", "-m", "server.campus_app", "worker"]
    healthcheck:
      disable: true
    stop_grace_period: 12m
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  campus-data:
  postgres-data:
