# 偷闲·天大版 —— nginx 站点配置
#
# 域名：touxian.47-238-195-42.sslip.io（sslip.io 免费通配 DNS，无需购买域名）
# 前提：证书已用 certbot 签发
#   certbot --nginx -d touxian.47-238-195-42.sslip.io -m 你的邮箱 --agree-tos --redirect --non-interactive
#
# 部署位置：/etc/nginx/conf.d/touxian.conf
# 与现有文件站（47-238-195-42.sslip.io）互不干扰：server_name 不同，各用各的证书。

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name touxian.47-238-195-42.sslip.io;

    # Let's Encrypt 续期验证（certbot --webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name touxian.47-238-195-42.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/touxian.47-238-195-42.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touxian.47-238-195-42.sslip.io/privkey.pem;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 附件上传上限（API 内部还会再校验 8 MiB）
    client_max_body_size 9m;

    # 不记录 URL：避免泄漏日历访问凭据与快照 read_token
    access_log off;
    error_log /var/log/nginx/touxian-error.log crit;

    # 附件替换端点：放宽超时，关闭缓冲
    location ~ ^/api/v1/admin/snapshots/[0-9a-fA-F-]{36}/replacement$ {
        client_max_body_size 9m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 主应用
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
