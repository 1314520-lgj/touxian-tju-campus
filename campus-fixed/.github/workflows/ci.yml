# GitHub Actions for 偷闲·天大版.
#
# Scope of this workflow (kept deliberately honest — it runs what any runner can
# verify without credentials or a real network):
#   * ruff check + format check against the pinned ruff.toml;
#   * backend pytest suite on Python 3.12 and 3.13 with the locked requirements;
#   * frontend unit tests on Node 24 and a production build of the campus SPA.
#
# NOT covered here, and not claimed elsewhere: Playwright browser acceptance
# (needs the vendored axe-core browser setup and per-entry servers, see
# BROWSER_ACCEPTANCE.md), PostgreSQL-backed cases (8 skipped without a server),
# real campus-network collection, SMTP, and container/cloud builds.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"

      - name: Pin a working ruff config check
        run: |
          ruff check --statistics .
          ruff format --check .

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The lock file is authoritative; requirements.txt is the human-readable
      # range list and is never used to install (AI_PENDING_TASKS T4).
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements-campus.lock.txt

      - name: Backend suite
        run: python -m pytest server/campus/tests -q --basetemp="$(mktemp -d)" -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Frontend unit tests
        run: node --test src/campus/tests/*.test.mjs

      - name: Production build
        run: pnpm install --frozen-lockfile && pnpm exec vite build

      # dist/ and web/ are two byte-identical copies of one build by design;
      # drift between them is a failing condition, and a build only proves it
      # after the artifacts land back in the tree. The parity class lives in
      # test_bootstrap.py (ShippedFrontendParityTests).
      - name: Shipped frontend parity (dist vs web)
        run: python -m pytest server/campus/tests/test_bootstrap.py -q -p no:cacheprovider -k ShippedFrontendParity
